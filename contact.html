<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Des Program - تواصل معنا</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- كود حماية الصفحة والتحقق من تسجيل الدخول -->
    <script>
        if (localStorage.getItem("isLoggedIn") !== "true") {
            window.location.href = "login.html";
        }
    </script>

    <style>
        :root { --bg-color: #050508; --card-bg: #0f1019; --primary-blue: #00d2ff; --primary-purple: #9d4edd; --accent-gradient: linear-gradient(135deg, #00d2ff 0%, #9d4edd 100%); --text-color: #ffffff; --text-muted: #a0a0b0; --border-color: rgba(0, 210, 255, 0.2); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); overflow-x: hidden; }
        
        header { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            background: rgba(5, 5, 8, 0.9); 
            backdrop-filter: blur(12px); 
            border-bottom: 1px solid var(--border-color); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 4%; 
            z-index: 1000; 
            transition: transform 0.3s ease, background-color 0.3s ease; 
            animation: headerMove 6s ease-in-out infinite alternate;
            flex-wrap: wrap;
            gap: 10px;
        }
        header.scrolled { background: rgba(5, 5, 8, 0.98); box-shadow: 0 5px 20px rgba(0,0,0,0.5); }

        @keyframes headerMove {
            0% { transform: translateX(0); }
            50% { transform: translateX(6px); }
            100% { transform: translateX(-6px); }
        }
        
        .logo-container { display: flex; align-items: center; gap: 8px; }
        .logo-container img { height: 32px; max-width: 100%; object-fit: contain; border-radius: 6px; }
        .logo-text { font-size: 0.95rem; font-weight: 700; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; white-space: nowrap; }
        
        nav ul { display: flex; list-style: none; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
        nav ul li a { color: var(--text-muted); text-decoration: none; font-weight: 500; font-size: 0.75rem; transition: 0.3s; white-space: nowrap; }
        nav ul li a:hover, nav ul li a.active { color: var(--primary-blue); text-shadow: 0 0 10px rgba(0, 210, 255, 0.5); }
        
        @media(max-width: 768px) {
            header { justify-content: center; padding: 8px 2%; }
            nav ul { gap: 8px; }
            nav ul li a { font-size: 0.7rem; }
        }

        .contact { padding: 130px 5% 80px; max-width: 700px; margin: 0 auto; }
        .section-title { text-align: center; font-size: 2.5rem; margin-bottom: 30px; font-weight: 900; }
        .section-title span { background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .contact-content { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 15px; padding: 40px; text-align: center; }
        .contact-content p { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 30px; line-height: 1.6; }
        .social-buttons { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .social-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 30px; border-radius: 30px; text-decoration: none; font-weight: 700; color: #fff; transition: 0.3s; }
        .whatsapp-btn { background: #25d366; box-shadow: 0 0 15px rgba(37, 211, 102, 0.4); }
        .whatsapp-btn:hover { background: #20ba5a; transform: translateY(-3px); }
        .instagram-btn { background: linear-gradient(45deg, #405de6, #5851db, #833ab4, #c13584, #fd1d1d); box-shadow: 0 0 15px rgba(193, 53, 132, 0.4); }
        .instagram-btn:hover { opacity: 0.9; transform: translateY(-3px); }
        
        footer { text-align: center; padding: 30px; border-top: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.9rem; position: fixed; bottom: 0; width: 100%; background: var(--bg-color); }
        @media(max-width: 768px) { footer { position: relative; margin-top: 50px; } }
    </style>
</head>
<body>
    <header id="mainHeader">
        <div class="logo-container">
            <img src="dess.jpg" alt="Des Program Logo" onerror="this.style.display='none'">
            <span class="logo-text">Des Program</span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="products.html">المنتجات والطلب</a></li>
                <li><a href="services.html">خدماتنا</a></li>
                <li><a href="about.html">من نحن</a></li>
                <li><a href="contact.html" class="active">تواصل معنا</a></li>
            </ul>
        </nav>
    </header>

    <section class="contact">
        <h2 class="section-title">تواصل <span>معنا </span></h2>
        <div class="contact-content">
            <p>للاستفسارات الخاصة والطلبات المخصصة لخدمات برمجة وتصميم مواقع الويب والدروع الذكية، يسعدنا تواصلكم معنا مباشرة:</p>
            <div class="social-buttons">
                <a href="https://wa.me/972566027617" target="_blank" class="social-btn whatsapp-btn">
                    <i class="fa-brands fa-whatsapp fa-lg"></i> واتساب 
                </a>
                <a href="https://www.instagram.com/des_program?igsi=YXc0emN3bW9qc3M1" target="_blank" class="social-btn instagram-btn">
                    <i class="fa-brands fa-instagram fa-lg"></i> انستغرام 
                </a>
            </div>
        </div>
    </section>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 Des Program | Code • Create • Solve</p>
    </footer>

    <script>
        const header = document.getElementById('mainHeader');
        window.addEventListener('scroll', function() {
            if (window.pageYOffset > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });
    </script>
</body>
</html>
