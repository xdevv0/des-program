<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Des Program - تواصل معنا</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --bg-color: #050508; --card-bg: #0f1019; --primary-blue: #00d2ff; --primary-purple: #9d4edd; --accent-gradient: linear-gradient(135deg, #00d2ff 0%, #9d4edd 100%); --text-color: #ffffff; --text-muted: #a0a0b0; --border-color: rgba(0, 210, 255, 0.2); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; scroll-behavior: smooth; }
        body { background-color: var(--bg-color); color: var(--text-color); overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        
        header { 
            position: fixed; top: 0; left: 0; width: 100%; 
            background: rgba(5, 5, 8, 0.95); backdrop-filter: blur(12px); 
            border-bottom: 1px solid var(--border-color); 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px 4%; z-index: 1000; transition: background-color 0.3s ease; 
        }
        header.scrolled { background: rgba(5, 5, 8, 0.98); box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
        
        .logo-container { display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .logo-container img { height: 32px; object-fit: contain; border-radius: 6px; }
        .logo-text { font-size: 0.95rem; font-weight: 700; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; white-space: nowrap; }
        
        /* روابط الشريط العلوي الموحد */
        nav ul { display: flex; list-style: none; gap: 15px; align-items: center; flex-wrap: wrap; }
        nav ul li a { 
            color: var(--text-muted); text-decoration: none; font-weight: 500; font-size: 0.85rem; 
            transition: 0.3s; white-space: nowrap; display: flex; align-items: center; gap: 5px; 
        }
        nav ul li a:hover, nav ul li a.active { color: var(--primary-blue); text-shadow: 0 0 10px rgba(0, 210, 255, 0.5); }
        nav ul li a.account-link { color: var(--primary-blue); border: 1px solid var(--border-color); padding: 4px 10px; border-radius: 6px; background: rgba(0, 210, 255, 0.05); }
        nav ul li a.account-link:hover { background: rgba(0, 210, 255, 0.15); }

        @media(max-width: 900px) {
            header { flex-direction: column; gap: 10px; padding: 10px 2%; }
            nav ul { justify-content: center; gap: 10px; }
            nav ul li a { font-size: 0.75rem; }
        }

        .contact { padding: 150px 5% 60px; max-width: 700px; margin: 0 auto; width: 100%; flex-grow: 1; }
        .section-title { text-align: center; font-size: 2.5rem; margin-bottom: 30px; font-weight: 900; }
        .section-title span { background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .contact-content { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 15px; padding: 40px; text-align: center; }
        .contact-content p { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 30px; line-height: 1.6; }
        .social-buttons { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .social-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 30px; border-radius: 30px; text-decoration: none; font-weight: 700; color: #fff; transition: 0.3s; }
        .whatsapp-btn { background: #25d366; box-shadow: 0 0 15px rgba(37, 211, 102, 0.4); }
        .whatsapp-btn:hover { background: #20ba5a; transform: translateY(-3px); }
        .instagram-btn { background: linear-gradient(45deg, #405de6, #5851db, #833ab4, #c13584, #fd1d1d); box-shadow: 0 0 15px rgba(193, 53, 132, 0.4); }
        .instagram-btn:hover { opacity: 0.9; transform: translateY(-3px); }
        
        footer { text-align: center; padding: 25px; border-top: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.85rem; background: var(--bg-color); }
    </style>
</head>
<body>

    <header id="mainHeader">
        <a href="index.html" class="logo-container">
            <img src="dess.jpg" alt="Logo" onerror="this.style.display='none'">
            <span class="logo-text">Des Program</span>
        </a>
        
        <!-- الشريط العلوي الموحد لجميع الأقسام ورابط حسابي -->
        <nav>
            <ul>
                <li><a href="index.html"><i class="fa-solid fa-house"></i> الرئيسية</a></li>
                <li><a href="products.html"><i class="fa-solid fa-box-open"></i> المنتجات والطلب</a></li>
                <li><a href="services.html"><i class="fa-solid fa-layer-group"></i> خدماتنا</a></li>
                <li><a href="about.html"><i class="fa-solid fa-circle-info"></i> من نحن</a></li>
                <li><a href="contact.html" class="active"><i class="fa-solid fa-headset"></i> تواصل معنا</a></li>
                <li><a href="account.html" class="account-link"><i class="fa-solid fa-user-gear"></i> حسابي</a></li>
            </ul>
        </nav>
    </header>

    <section class="contact">
        <h2 class="section-title">تواصل <span>معنا</span></h2>
        <div class="contact-content">
            <p>للاستفسارات الخاصة والطلبات المخصصة لخدمات برمجة وتصميم مواقع الويب والدروع الذكية، يسعدنا تواصلكم معنا مباشرة:</p>
            <div class="social-buttons">
                <a href="https://wa.me/972566027617" target="_blank" class="social-btn whatsapp-btn">
                    <i class="fa-brands fa-whatsapp fa-lg"></i> واتساب 
                </a>
                <a href="https://www.instagram.com/des_program?igsi=YXc0emN3bW9qc3M1" target="_blank" class="social-btn instagram-btn">
                    <i class="fa-brands fa-instagram fa-lg"></i> انستغرام 
                </a>
            </div>
        </div>
    </section>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 Des Program | Code • Create • Solve</p>
    </footer>

    <script>
        window.addEventListener('scroll', function() {
            const header = document.getElementById('mainHeader');
            if (window.pageYOffset > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });
    </script>
</body>
</html>
