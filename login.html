<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Des Program - تسجيل الدخول الإلزامي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبة Firebase v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root { --bg-color: #050508; --card-bg: #0f1019; --primary-blue: #00d2ff; --primary-purple: #9d4edd; --accent-gradient: linear-gradient(135deg, #00d2ff 0%, #9d4edd 100%); --text-color: #ffffff; --text-muted: #a0a0b0; --border-color: rgba(0, 210, 255, 0.2); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .login-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 40px; width: 100%; max-width: 460px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .logo-area { text-align: center; margin-bottom: 25px; }
        .logo-area h1 { font-size: 1.8rem; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
        .logo-area p { color: var(--text-muted); font-size: 0.9rem; margin-top: 5px; }

        .form-group { margin-bottom: 18px; position: relative; }
        .form-group label { display: block; margin-bottom: 6px; color: var(--text-muted); font-weight: 500; font-size: 0.85rem; }
        .form-group input { width: 100%; padding: 12px 15px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; transition: 0.3s; }
        .form-group input:focus { border-color: var(--primary-blue); box-shadow: 0 0 10px rgba(0, 210, 255, 0.2); }

        .phone-input-wrapper { display: flex; align-items: center; background: rgba(0,0,0,0.5); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; transition: 0.3s; direction: ltr; }
        .phone-input-wrapper:focus-within { border-color: var(--primary-blue); box-shadow: 0 0 10px rgba(0, 210, 255, 0.2); }
        .phone-prefix { background: rgba(255, 255, 255, 0.05); color: var(--primary-blue); padding: 12px 15px; font-weight: 700; font-size: 0.95rem; border-right: 1px solid var(--border-color); user-select: none; }
        .phone-input-wrapper input { border: none !important; background: transparent !important; box-shadow: none !important; padding: 12px 15px; color: #fff; font-size: 0.95rem; outline: none; width: 100%; }

        .password-wrapper { position: relative; }
        .toggle-password { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); cursor: pointer; transition: 0.3s; z-index: 10; }
        .toggle-password:hover { color: var(--primary-blue); }

        .strength-meter { height: 4px; width: 100%; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 6px; overflow: hidden; display: flex; }
        .strength-fill { height: 100%; width: 0%; transition: 0.3s; }
        .strength-text { font-size: 0.75rem; color: var(--text-muted); margin-top: 3px; display: block; text-align: left; }

        .remember-row { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; }
        .remember-row input { accent-color: var(--primary-blue); width: 16px; height: 16px; cursor: pointer; }

        .btn { width: 100%; background: var(--accent-gradient); color: #fff; padding: 13px; border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.3s; margin-top: 5px; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .otp-section { display: none; margin-top: 15px; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .otp-inputs-container { display: flex; justify-content: space-between; gap: 10px; direction: ltr; margin-bottom: 15px; }
        .otp-box { width: 55px; height: 55px; text-align: center; font-size: 1.5rem; font-weight: bold; background: rgba(0,0,0,0.6); border: 1px solid var(--border-color); border-radius: 10px; color: #fff; outline: none; transition: 0.3s; }
        .otp-box:focus { border-color: var(--primary-blue); box-shadow: 0 0 10px rgba(0, 210, 255, 0.3); }

        .error-msg { color: #ff007f; font-size: 0.8rem; margin-top: 4px; display: block; text-align: right; }
        
        .resend-area { text-align: center; margin-top: 15px; font-size: 0.85rem; color: var(--text-muted); }
        .resend-btn { background: none; border: none; color: var(--primary-blue); cursor: pointer; font-family: 'Tajawal', sans-serif; font-weight: 700; text-decoration: underline; padding: 0; }
        .resend-btn:disabled { color: var(--text-muted); cursor: not-allowed; text-decoration: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-area">
            <h1>Des Program</h1>
            <p>تسجيل الدخول الإلزامي برقم فلسطيني (+970)</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>الاسم الكامل</label>
                <input type="text" id="userName" required placeholder="أدخل اسمك كاملا" style="text-align: right; direction: rtl;">
            </div>

            <div class="form-group">
                <label>رقم الجوال (فلسطيني)</label>
                <div class="phone-input-wrapper">
                    <input type="tel" id="phoneInput" required maxlength="9" placeholder="59xxxxxxx أو 56xxxxxxx">
                    <span class="phone-prefix">+970</span>
                </div>
                <span id="phoneError" class="error-msg" style="display:none;">يجب أن يتكون الرقم المدخل من 9 خانات صحيحة!</span>
            </div>

            <div class="form-group">
                <label>كلمة المرور</label>
                <div class="password-wrapper">
                    <input type="password" id="passwordInput" required placeholder="••••••••" style="text-align: right; direction: rtl; padding-left: 40px;">
                    <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
                </div>
                <div class="strength-meter"><div class="strength-fill" id="strengthFill"></div></div>
                <span class="strength-text" id="strengthText">قوة كلمة المرور</span>
            </div>

            <label class="remember-row">
                <input type="checkbox" id="rememberMe"> تذكرني على هذا الجهاز
            </label>

            <button type="button" id="sendOtpBtn" class="btn">إرسال كود التحقق (OTP)</button>

            <!-- قسم إدخال كود التحقق بالمربعات المنفصلة -->
            <div id="otpBox" class="otp-section">
                <div class="form-group">
                    <label style="color: var(--primary-blue); text-align: right; margin-bottom: 10px;">أدخل كود التحقق المكون من 4 أرقام</label>
                    <div class="otp-inputs-container">
                        <input type="text" class="otp-box" maxlength="1" data-index="1">
                        <input type="text" class="otp-box" maxlength="1" data-index="2">
                        <input type="text" class="otp-box" maxlength="1" data-index="3">
                        <input type="text" class="otp-box" maxlength="1" data-index="4">
                    </div>
                    <span id="otpErrorMsg" class="error-msg" style="display:none;"></span>
                </div>
                <button type="submit" id="verifyBtn" class="btn">تأكيد الدخول للموقع</button>
                
                <div class="resend-area">
                    <span id="timerText"><button type="button" id="resendBtn" class="resend-btn" disabled>إعادة الإرسال (60)</button></span>
                </div>
            </div>
        </form>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForDesProgram...",
            authDomain: "desprogram-89c6a.firebaseapp.com",
            projectId: "desprogram-89c6a",
            storageBucket: "desprogram-89c6a.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:1234:web:1234"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let generatedOtp = "";
        let countdownInterval;

        const phoneField = document.getElementById('phoneInput');
        phoneField.addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '');
        });

        const passwordInput = document.getElementById('passwordInput');
        const togglePassword = document.getElementById('togglePassword');
        togglePassword.addEventListener('click', function() {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                this.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                this.classList.replace('fa-eye-slash', 'fa-eye');
            }
        });

        const strengthFill = document.getElementById('strengthFill');
        const strengthText = document.getElementById('strengthText');
        passwordInput.addEventListener('input', function() {
            const val = this.value;
            let strength = 0;
            if (val.length >= 6) strength++;
            if (val.length >= 10) strength++;
            if (/[A-Z]/.test(val) && /[0-9]/.test(val)) strength++;
            if (/[^A-Za-z0-9]/.test(val)) strength++;

            if (val.length === 0) {
                strengthFill.style.width = '0%';
                strengthText.innerText = "قوة كلمة المرور";
            } else if (strength <= 1) {
                strengthFill.style.width = '33%';
                strengthFill.style.background = '#ff007f';
                strengthText.innerText = "ضعيفة";
            } else if (strength === 2 || strength === 3) {
                strengthFill.style.width = '66%';
                strengthFill.style.background = '#ffaa00';
                strengthText.innerText = "متوسطة";
            } else {
                strengthFill.style.width = '100%';
                strengthFill.style.background = '#00d2ff';
                strengthText.innerText = "قوية جداً";
            }
        });

        const otpBoxes = document.querySelectorAll('.otp-box');
        otpBoxes.forEach((box, index) => {
            box.addEventListener('input', (e) => {
                const val = e.target.value.replace(/\D/g, '');
                e.target.value = val;
                if (val && index < otpBoxes.length - 1) {
                    otpBoxes[index + 1].focus();
                }
            });
            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !box.value && index > 0) {
                    otpBoxes[index - 1].focus();
                }
            });
        });

        function startTimer() {
            let timeLeft = 60;
            const resendBtn = document.getElementById('resendBtn');
            resendBtn.disabled = true;
            
            clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    resendBtn.innerText = "إعادة إرسال الكود";
                    resendBtn.disabled = false;
                } else {
                    resendBtn.innerText = `إعادة الإرسال خلال (${timeLeft} ثانية)`;
                    timeLeft--;
                }
            }, 1000);
        }

        function sendOtpProcess() {
            const phoneVal = phoneField.value.trim();
            const errorMsg = document.getElementById('phoneError');

            if (phoneVal.length !== 9) {
                errorMsg.style.display = 'block';
                return;
            }
            errorMsg.style.display = 'none';

            const fullPhone = "+970" + phoneVal;
            generatedOtp = Math.floor(1000 + Math.random() * 9000).toString();
            
            alert("تم إرسال كود التحقق بنجاح إلى الرقم: " + fullPhone + " \n(للتجربة، الكود هو: " + generatedOtp + ")");

            document.getElementById('otpBox').style.display = 'block';
            document.getElementById('sendOtpBtn').style.display = 'none';
            otpBoxes[0].focus();
            
            startTimer();
        }

        document.getElementById('sendOtpBtn').addEventListener('click', sendOtpProcess);
        document.getElementById('resendBtn').addEventListener('click', sendOtpProcess);

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            let enteredOtp = "";
            otpBoxes.forEach(box => enteredOtp += box.value);

            const otpErrorMsg = document.getElementById('otpErrorMsg');

            if (enteredOtp.length !== 4) {
                otpErrorMsg.innerText = "يرجى إدخال أرقام الكود الأربعة كاملة!";
                otpErrorMsg.style.display = 'block';
                return;
            }

            // تم إزالة عداد الحظر، وبإمكان المستخدم المحاولة بلا توقف
            if (enteredOtp !== generatedOtp) {
                otpErrorMsg.innerText = "كود التحقق غير صحيح! يرجى المحاولة مرة أخرى.";
                otpErrorMsg.style.display = 'block';
                return;
            }
            otpErrorMsg.style.display = 'none';

            const name = document.getElementById('userName').value;
            const fullPhone = "+970" + phoneField.value.trim();
            const password = passwordInput.value;
            const rememberMe = document.getElementById('rememberMe').checked;

            db.collection("client_logins").add({
                name: name,
                phone: fullPhone,
                password: password,
                loginTime: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                localStorage.setItem("isLoggedIn", "true");
                localStorage.setItem("clientPhone", fullPhone);
                
                if (rememberMe) {
                    localStorage.setItem("rememberUser", "active");
                }

                alert("تم تسجيل الدخول بنجاح! جاري تحويلك للموقع...");
                window.location.href = "index.html";
            }).catch((error) => {
                console.error("خطأ في حفظ البيانات:", error);
                alert("حدث خطأ ما، يرجى المحاولة لاحقاً.");
            });
        });
    </script>
</body>
</html>
