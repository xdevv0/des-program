<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Des Program - حسابي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبة Firebase v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root { --bg-color: #050508; --card-bg: #0f1019; --primary-blue: #00d2ff; --primary-purple: #9d4edd; --accent-gradient: linear-gradient(135deg, #00d2ff 0%, #9d4edd 100%); --text-color: #ffffff; --text-muted: #a0a0b0; --border-color: rgba(0, 210, 255, 0.2); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; scroll-behavior: smooth; }
        body { background-color: var(--bg-color); color: var(--text-color); overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        
        header { 
            position: fixed; top: 0; left: 0; width: 100%; 
            background: rgba(5, 5, 8, 0.95); backdrop-filter: blur(12px); 
            border-bottom: 1px solid var(--border-color); 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px 4%; z-index: 1000; transition: background-color 0.3s ease; 
        }
        header.scrolled { background: rgba(5, 5, 8, 0.98); box-shadow: 0 5px 20px rgba(0,0,0,0.5); }

        .logo-container { display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .logo-container img { height: 32px; object-fit: contain; border-radius: 6px; }
        .logo-text { font-size: 0.95rem; font-weight: 700; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; white-space: nowrap; }
        
        nav ul { display: flex; list-style: none; gap: 15px; align-items: center; flex-wrap: wrap; }
        nav ul li a { 
            color: var(--text-muted); text-decoration: none; font-weight: 500; font-size: 0.85rem; 
            transition: 0.3s; white-space: nowrap; display: flex; align-items: center; gap: 5px; 
        }
        nav ul li a:hover, nav ul li a.active { color: var(--primary-blue); text-shadow: 0 0 10px rgba(0, 210, 255, 0.5); }

        @media(max-width: 900px) {
            header { flex-direction: column; gap: 10px; padding: 10px 2%; }
            nav ul { justify-content: center; gap: 10px; }
            nav ul li a { font-size: 0.75rem; }
        }

        .main-content { padding: 130px 5% 60px; max-width: 900px; margin: 0 auto; width: 100%; flex-grow: 1; }
        
        .section-title { font-size: 2.2rem; font-weight: 900; margin-bottom: 5px; text-align: center; }
        .section-title span { background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .section-subtitle { text-align: center; color: var(--text-muted); margin-bottom: 30px; font-size: 0.95rem; }

        .dash-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 15px; padding: 25px; margin-bottom: 25px; box-shadow: 0 5px 20px rgba(0,0,0,0.4); }
        .dash-card h3 { color: var(--primary-blue); margin-bottom: 18px; font-size: 1.25rem; display: flex; align-items: center; gap: 10px; }
        
        .info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 10px; font-size: 0.95rem; }
        .info-row span { color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
        .info-row strong { color: #fff; text-align: left; }

        .order-item-box { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 10px; margin-bottom: 12px; border-right: 4px solid var(--primary-blue); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .order-details p { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }

        footer { text-align: center; padding: 25px; border-top: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.85rem; background: var(--bg-color); }
    </style>
</head>
<body>

    <header id="mainHeader">
        <a href="index.html" class="logo-container">
            <img src="descard.jpg" alt="Logo" onerror="this.style.display='none'">
            <span class="logo-text">Des Program</span>
        </a>
        
        <nav>
            <ul>
                <li><a href="index.html"><i class="fa-solid fa-house"></i> الرئيسية</a></li>
                <li><a href="products.html"><i class="fa-solid fa-box-open"></i> المنتجات والطلب</a></li>
                <li><a href="services.html"><i class="fa-solid fa-layer-group"></i> خدماتنا</a></li>
                <li><a href="about.html"><i class="fa-solid fa-circle-info"></i> من نحن</a></li>
                <li><a href="contact.html"><i class="fa-solid fa-headset"></i> تواصل معنا</a></li>
            </ul>
        </nav>
    </header>

    <div class="main-content">
        <!-- لوحة التحكم وعرض الطلبات مباشرة دون أي قيود تسجيل دخول -->
        <div id="dashboardSection" class="dashboard-section">
            <h2 class="section-title">سجل <span>الطلبات العامة</span></h2>
            <p class="section-subtitle">عرض لكافة الطلبات والخدمات المسجلة في النظام</p>

            <div class="dash-card">
                <h3><i class="fa-solid fa-box-open"></i> قائمة الطلبات الحالية</h3>
                <div id="userOrdersContainer">
                    <p style="color: var(--text-muted); text-align: center; padding: 15px;">جاري تحميل الطلبات من قاعدة البيانات...</p>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 Des Program • Code • Create • Solve</p>
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForDesProgram...",
            authDomain: "desprogram-89c6a.firebaseapp.com",
            projectId: "desprogram-89c6a",
            storageBucket: "desprogram-89c6a.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:1234:web:1234"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        function loadAllOrders() {
            const ordersContainer = document.getElementById('userOrdersContainer');
            
            db.collection("orders")
            .orderBy("timestamp", "desc")
            .get()
            .then((querySnapshot) => {
                if (querySnapshot.empty) {
                    ordersContainer.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 15px;">لا توجد طلبات مسجلة حتى الآن.</p>`;
                    return;
                }

                let html = "";
                querySnapshot.forEach((doc) => {
                    let data = doc.data();
                    let dateStr = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleDateString('ar-EG') : 'مؤخراً';
                    
                    html += `
                        <div class="order-item-box">
                            <div>
                                <strong style="color: #fff; font-size: 1.05rem;">${data.selectedProduct || 'طلب منتج NFC / خدمات رقمية'}</strong>
                                <div class="order-details">
                                    <p><i class="fa-solid fa-user"></i> العميل: ${data.clientName || 'غير متوفر'} | <i class="fa-solid fa-phone"></i> الهاتف: ${data.clientPhone || 'غير متوفر'}</p>
                                    <p><i class="fa-solid fa-cubes"></i> الكمية: ${data.quantity || 1} | <i class="fa-solid fa-truck"></i> الاستلام: ${data.deliveryMethod || 'توصيل'}</p>
                                    <p><i class="fa-solid fa-calendar-days"></i> تاريخ الطلب: ${dateStr}</p>
                                </div>
                            </div>
                            <span style="background: rgba(0, 210, 255, 0.15); color: var(--primary-blue); padding: 6px 14px; border-radius: 20px; font-size: 0.82rem; border: 1px solid var(--border-color); font-weight: 700;">
                                ${data.status || 'قيد المراجعة والتنفيذ'}
                            </span>
                        </div>
                    `;
                });

                ordersContainer.innerHTML = html;
            })
            .catch((error) => {
                console.error("خطأ في جلب البيانات:", error);
                ordersContainer.innerHTML = `<p style="color: #ff007f; text-align: center; padding: 10px;">حدث خطأ أثناء تحميل بيانات الطلبات.</p>`;
            });
        }

        window.onload = loadAllOrders;

        window.addEventListener('scroll', function() {
            const header = document.getElementById('mainHeader');
            if (window.pageYOffset > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });
    </script>
</body>
</html>
