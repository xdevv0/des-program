<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Des Program - الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-color: #050508; --card-bg: #0f1019; --primary-blue: #00d2ff; --primary-purple: #9d4edd; --accent-gradient: linear-gradient(135deg, #00d2ff 0%, #9d4edd 100%); --text-color: #ffffff; --text-muted: #a0a0b0; --border-color: rgba(0, 210, 255, 0.2); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; scroll-behavior: smooth; }
        body { background-color: var(--bg-color); color: var(--text-color); overflow-x: hidden; }
        header { position: fixed; top: 0; left: 0; width: 100%; background: rgba(5, 5, 8, 0.85); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; z-index: 1000; }
        .logo-container { display: flex; align-items: center; gap: 12px; }
        .logo-container img { height: 45px; object-fit: contain; border-radius: 6px; }
        .logo-text { font-size: 1.2rem; font-weight: 700; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        nav ul { display: flex; list-style: none; gap: 20px; }
        nav ul li a { color: var(--text-muted); text-decoration: none; font-weight: 500; transition: 0.3s; }
        nav ul li a:hover, nav ul li a.active { color: var(--primary-blue); text-shadow: 0 0 10px rgba(0, 210, 255, 0.5); }
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 20px; background: radial-gradient(circle at center, #121025 0%, var(--bg-color) 70%); }
        .hero h1 { font-size: 3.2rem; font-weight: 900; margin-bottom: 15px; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { font-size: 1.2rem; color: var(--text-muted); max-width: 650px; margin-bottom: 30px; line-height: 1.6; }
        .btn { background: var(--accent-gradient); color: #fff; padding: 12px 35px; border-radius: 30px; text-decoration: none; font-weight: 700; box-shadow: 0 0 20px rgba(157, 78, 221, 0.4); transition: 0.3s; }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 0 30px rgba(0, 210, 255, 0.7); }
        footer { text-align: center; padding: 30px; border-top: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.9rem; }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="dess.jpg" alt="Des Program Logo">
            <span class="logo-text">Des Program</span>
        </div>
        <nav>
            <ul>
                <li><a href="des.html" class="active">الرئيسية</a></li>
                <li><a href="products.html">منتجاتنا</a></li>
                <li><a href="services.html">خدماتنا</a></li>
                <li><a href="about.html">من نحن</a></li>
                <li><a href="contact.html">تواصل معنا</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <h1>Code • Create • Solve</h1>
        <p>نبتكر حلولاً رقمية وتقنية متقدمة، ندمج البرمجة الذكية بتقنية NFC لأجل تجربة تفاعلية فريدة ومستقبلية.</p>
        <a href="products.html" class="btn">استعرض منتجاتنا الذكية</a>
    </section>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 Des Program | Code • Create • Solve</p>
    </footer>
</body>
</html>
