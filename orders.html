<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلتي وطلباتي - Des Program</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root { 
            --bg-color: #050508; 
            --card-bg: #0f1019; 
            --primary-blue: #00d2ff; 
            --primary-purple: #9d4edd; 
            --accent-gradient: linear-gradient(135deg, #00d2ff 0%, #9d4edd 100%); 
            --text-color: #ffffff; 
            --text-muted: #a0a0b0; 
            --border-color: rgba(0, 210, 255, 0.2); 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 30px 5%; min-height: 100vh; }
        
        .page-header { text-align: center; margin-bottom: 40px; border-bottom: 1px solid var(--border-color); padding-bottom: 25px; }
        .page-header h1 { font-size: 2.2rem; font-weight: 900; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        .page-header p { color: var(--text-muted); font-size: 1rem; }

        /* صندوق إدخال رقم الهاتف للبحث عن الطلبات */
        .login-box { max-width: 450px; margin: 0 auto 40px auto; background: var(--card-bg); border: 1px solid var(--border-color); padding: 30px; border-radius: 16px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .login-box h3 { margin-bottom: 15px; font-size: 1.2rem; color: #fff; }
        .input-group { display: flex; gap: 10px; margin-top: 15px; }
        .input-group input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); padding: 12px 15px; border-radius: 10px; color: #fff; font-family: 'Tajawal', sans-serif; font-size: 1rem; outline: none; transition: 0.3s; direction: ltr; text-align: right; }
        .input-group input:focus { border-color: var(--primary-blue); box-shadow: 0 0 10px rgba(0,210,255,0.2); }
        .input-group button { background: var(--accent-gradient); color: #fff; border: none; padding: 0 20px; border-radius: 10px; cursor: pointer; font-family: 'Tajawal', sans-serif; font-weight: 700; transition: 0.3s; }
        .input-group button:hover { opacity: 0.85; transform: translateY(-1px); }

        /* قسم عرض الطلبات */
        .orders-section { display: none; }
        .orders-section.active { display: block; }
        
        .client-info-bar { background: var(--card-bg); border: 1px solid var(--border-color); padding: 15px 25px; border-radius: 12px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .client-info-bar span { color: var(--primary-blue); font-weight: 700; }
        .change-phone-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--text-muted); color: var(--text-muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-family: 'Tajawal', sans-serif; font-size: 0.85rem; transition: 0.3s; }
        .change-phone-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

        .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .order-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 25px; position: relative; transition: 0.3s; }
        .order-card:hover { border-color: var(--primary-blue); box-shadow: 0 5px 20px rgba(0,210,255,0.1); }
        
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px; }
        .order-id { font-size: 0.85rem; color: var(--text-muted); font-family: monospace; }
        
        .status-badge { padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
        .status-pending { background: rgba(255, 170, 0, 0.15); color: #ffaa00; }
        .status-completed { background: rgba(0, 255, 128, 0.15); color: #00ff80; }

        .order-item-title { font-size: 1.15rem; color: var(--primary-blue); font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .order-detail { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 8px; }
        .order-detail span { color: #fff; font-weight: 500; }
        
        .extra-box { background: rgba(0, 210, 255, 0.05); border: 1px dashed var(--border-color); padding: 10px; border-radius: 8px; margin-top: 12px; font-size: 0.85rem; color: #e0d0f0; }
        .extra-box a { color: var(--primary-blue); text-decoration: underline; }

        .no-orders-msg { text-align: center; color: var(--text-muted); font-size: 1.1rem; padding: 40px; grid-column: 1 / -1; }

        /* ستايل إشعارات السوشيال ميديا المنبثقة */
        .toast-notification {
            position: fixed; bottom: 20px; left: 20px; background: var(--card-bg); 
            border: 1px solid var(--primary-blue); color: #fff; padding: 15px 20px; 
            border-radius: 12px; box-shadow: 0 10px 30px rgba(0,210,255,0.3); 
            z-index: 99999; display: flex; align-items: center; gap: 12px;
            max-width: 320px; font-family: 'Tajawal', sans-serif;
            animation: slideIn 0.4s ease;
        }
        @keyframes slideIn { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <div class="page-header">
        <h1><i class="fa-solid fa-bag-shopping"></i> سلتي وطلباتي</h1>
        <p>تابع حالة طلباتك الحالية وتعرف على المنتجات التي قمت بطلبها لحظة بلحظة</p>
    </div>

    <!-- خطوة 1: إدخال رقم الهاتف -->
    <div class="login-box" id="loginBox">
        <h3>أدخل رقم هاتفك لعرض مشترياتك وطلباتك</h3>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 15px;">يجب أن يكون نفس الرقم الذي استخدمته عند إتمام الطلب.</p>
        <div class="input-group">
            <input type="tel" id="phoneInput" placeholder="مثال: 0591234567" required>
            <button onclick="loadClientOrders()"><i class="fa-solid fa-search"></i> عرض طلباتي</button>
        </div>
    </div>

    <!-- خطوة 2: عرض قائمة الطلبات -->
    <div class="orders-section" id="ordersSection">
        <div class="client-info-bar">
            <div>عرض طلبات الرقم: <span id="displayPhone">---</span></div>
            <button class="change-phone-btn" onclick="resetPhone()"><i class="fa-solid fa-rotate-right"></i> تغيير الرقم</button>
        </div>

        <div class="orders-grid" id="clientOrdersContainer">
            <!-- سيتم حقن الطلبات هنا برمجياً -->
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForDesProgram...",
            authDomain: "desprogram-89c6a.firebaseapp.com",
            projectId: "desprogram-89c6a",
            storageBucket: "desprogram-89c6a.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:1234:web:1234"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let unsubscribeOrders = null;
        let unsubscribeNotifs = null;

        // التحقق إذا كان الزبون مسجلاً رقمه مسبقاً في متصفحه (LocalStorage)
        window.onload = function() {
            const savedPhone = localStorage.getItem('des_client_phone');
            if (savedPhone) {
                document.getElementById('phoneInput').value = savedPhone;
                loadClientOrders();
            }
        }

        function loadClientOrders() {
            const phone = document.getElementById('phoneInput').value.trim();
            if (!phone) {
                alert("الرجاء إدخال رقم الهاتف بشكل صحيح.");
                return;
            }

            // حفظ الرقم محلياً لكي لا يضطر لإدخاله في كل مرة يزور فيها الصفحة
            localStorage.setItem('des_client_phone', phone);
            
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('ordersSection').classList.add('active');
            document.getElementById('displayPhone').innerText = phone;

            // جلب الطلبات المرتبطة برقم الهاتف بشكل حي (Real-time listener)
            if (unsubscribeOrders) unsubscribeOrders(); // إلغاء الاتصال السابق إن وجد

            unsubscribeOrders = db.collection("orders")
                .where("clientPhone", "==", phone)
                .orderBy("timestamp", "desc")
                .onSnapshot((snapshot) => {
                    const container = document.getElementById('clientOrdersContainer');
                    container.innerHTML = "";

                    if (snapshot.empty) {
                        container.innerHTML = `<div class="no-orders-msg"><i class="fa-solid fa-box-open" style="font-size: 2.5rem; margin-bottom: 10px; display: block; color: var(--primary-blue);"></i>لا توجد أي طلبات مسجلة بهذا الرقم حتى الآن.</div>`;
                        return;
                    }

                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        const isCompleted = data.status === "completed";
                        const statusClass = isCompleted ? "status-completed" : "status-pending";
                        const statusText = isCompleted ? "تم التجهيز وجاهز للاستلام 🚀" : "قيد التجهيز ⏳";
                        
                        let timeString = "قيد المعالجة";
                        if (data.timestamp) {
                            timeString = data.timestamp.toDate().toLocaleString('ar-EG');
                        }

                        let extraDetailsHtml = "";
                        if (data.designDetails) {
                            extraDetailsHtml = `<div class="extra-box"><strong>التفاصيل:</strong> ${data.designDetails}</div>`;
                        } else if (data.websiteLink) {
                            extraDetailsHtml = `<div class="extra-box"><strong>الرابط:</strong> <a href="${data.websiteLink}" target="_blank">${data.websiteLink}</a></div>`;
                        }

                        container.innerHTML += `
                            <div class="order-card">
                                <div class="order-header">
                                    <span class="order-id">#${doc.id.substring(0, 6)}</span>
                                    <span class="status-badge ${statusClass}">${statusText}</span>
                                </div>
                                <div class="order-item-title"><i class="fa-solid fa-cube"></i> ${data.selectedProduct || 'منتج'}</div>
                                <div class="order-detail"><i class="fa-solid fa-city" style="width: 20px; color: var(--primary-purple);"></i> المدينة: <span>${data.clientCity || 'غير متوفر'}</span></div>
                                <div class="order-detail"><i class="fa-solid fa-location-dot" style="width: 20px; color: var(--primary-purple);"></i> العنوان: <span>${data.clientAddress || 'غير متوفر'}</span></div>
                                <div class="order-detail"><i class="fa-regular fa-clock" style="width: 20px; color: var(--primary-purple);"></i> وقت الطلب: <span>${timeString}</span></div>
                                ${extraDetailsHtml}
                            </div>
                        `;
                    });
                }, (error) => {
                    console.error("خطأ في جلب الطلبات: ", error);
                    // في حال تطلب الأمر مؤشر Index في فايرستور، ستظهر رسالة الخطأ هنا أو يفضل جلب الطلبات بدون OrderBy مؤقتاً
                });

            // تفعيل الاستماع للإشعارات الخاصة بهذا الزبون (مثل إشعارات فيسبوك/إنستغرام)
            listenToClientNotifications(phone);
        }

        function listenToClientNotifications(phone) {
            if (unsubscribeNotifs) unsubscribeNotifs();

            unsubscribeNotifs = db.collection("client_notifications")
                .where("clientPhone", "==", phone)
                .orderBy("timestamp", "desc")
                .onSnapshot((snapshot) => {
                    snapshot.docChanges().forEach((change) => {
                        if (change.type === "added") {
                            const notif = change.doc.data();
                            showNotificationToast(notif.title, notif.message);
                        }
                    });
                });
        }

        function showNotificationToast(title, message) {
            // إزالة أي إشعار سابق إن وجد
            const oldToast = document.getElementById('activeToast');
            if (oldToast) oldToast.remove();

            const toast = document.createElement('div');
            toast.id = 'activeToast';
            toast.className = 'toast-notification';
            toast.innerHTML = `
                <div style="background: var(--accent-gradient); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                    <i class="fa-solid fa-bell" style="color: #fff;"></i>
                </div>
                <div>
                    <h4 style="margin: 0 0 4px 0; font-size: 0.95rem; color: var(--primary-blue);">${title}</h4>
                    <p style="margin: 0; font-size: 0.8rem; color: var(--text-muted);">${message}</p>
                </div>
            `;
            document.body.appendChild(toast);
            setTimeout(() => { if(toast) toast.remove(); }, 6000);
        }

        function resetPhone() {
            localStorage.removeItem('des_client_phone');
            if (unsubscribeOrders) unsubscribeOrders();
            if (unsubscribeNotifs) unsubscribeNotifs();
            document.getElementById('ordersSection').classList.remove('active');
            document.getElementById('loginBox').style.display = 'block';
            document.getElementById('phoneInput').value = '';
        }
    </script>
</body>
</html>
